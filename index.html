<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniAiGuide</title>
  </head>
  <body>
    <main>
      <h1>UniAiGuide</h1>

      <form id="QuestionInput">
       <input type="text" id="question" name="question" placeholder="Type your question here" style="width: 300px; padding: 10px;"/>
        <button type="submit" style="padding: 10px 15px; margin-left: 10px;">
          Send
        </button>
      </form>
      <h3>Answer:</h3>
        <p id="answer"></p>
    </main>

    <footer>
      <p>© 2026 UniAiGuide</p>
    </footer>

    <script>
  document.getElementById('QuestionInput').addEventListener('submit', async function(event) {
    event.preventDefault();

    const question = document.getElementById('question').value;
    const answer = document.getElementById('answer');

    answer.textContent = 'Thinking...';

    try {
      const response = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: question })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'The request failed.');
      }

      answer.textContent = data.answer || 'The AI returned no answer.';
    } catch (error) {
      answer.textContent = 'Could not get an answer: ' + error.message;
    }
  });
</script>

    </script>
  </body>
</html>
